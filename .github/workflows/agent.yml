name: agent

on:
  schedule:
    - cron: "17 */12 * * *"  # every 12 hours; keep RUN_EVERY_HOURS below in sync
  workflow_dispatch: {}       # "Run workflow" button for a session right now

permissions:
  contents: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Git identity
        run: |
          git config user.name "buildvote-agent"
          git config user.email "buildvote-agent@users.noreply.github.com"
      - name: Run one session
        run: python3 agent/run.py
        env:
          # Runs on your Claude Pro subscription. Make the token with: claude setup-token
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BILLING: subscription
          MAX_SESSIONS_PER_DAY: "2"
          # To switch to a paid API key later: add ANTHROPIC_API_KEY, set BILLING: api, and use DAILY_BUDGET_USD.
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # DAILY_BUDGET_USD: "5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_TURNS: "25"
          RUN_EVERY_HOURS: "12"
